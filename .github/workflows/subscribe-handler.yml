name: 自动处理日报订阅

on:
  issues:
    types: [opened]

jobs:
  handle-subscribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    if: startsWith(github.event.issue.title, '订阅日报：')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract email and update subscribers
        id: update
        run: |
          python << 'PYEOF'
          import json, re, os, sys

          issue_title = os.environ.get('ISSUE_TITLE', '')
          print(f'Issue title: {issue_title}')

          # Extract email from title: 订阅日报：xxx@xxx.com
          m = re.search(r'订阅日报[：:]\s*([^\s]+@[^\s]+)', issue_title)
          if not m:
              print('ERROR: Could not extract email from title')
              sys.exit(1)

          email = m.group(1).strip().lower()
          print(f'Extracted email: {email}')

          # Validate email format
          if not re.match(r'^[\w\.-]+@[\w\.-]+\.\w+$', email):
              print(f'ERROR: Invalid email format: {email}')
              sys.exit(1)

          # Read subscribers.json
          subscribers_path = 'subscribers.json'
          try:
              with open(subscribers_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception as e:
              print(f'Warning: could not read subscribers.json: {e}, starting fresh')
              data = {'emails': []}

          emails = data.get('emails', [])
          if email in emails:
              print(f'Email already subscribed: {email}')
              with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a', encoding='utf-8') as f:
                  f.write(f'email={email}\n')
                  f.write('already=true\n')
              sys.exit(0)

          emails.append(email)
          data['emails'] = emails

          with open(subscribers_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f'Added email: {email}')
          print(f'Total subscribers: {len(emails)}')

          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a', encoding='utf-8') as f:
              f.write(f'email={email}\n')
              f.write('already=false\n')
          PYEOF
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Commit and push subscribers.json
        if: steps.update.outputs.already == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscribers.json
          git diff --cached --quiet || git commit -m "chore: add subscriber ${{ steps.update.outputs.email }} [skip ci]"
          git push

      - name: Install dependencies for immediate report
        if: steps.update.outputs.already == 'false'
        run: pip install -r scripts/requirements.txt

      - name: Send today's daily report to new subscriber
        if: steps.update.outputs.already == 'false'
        run: python scripts/main.py
        env:
          IMMEDIATE_RECIPIENTS: ${{ steps.update.outputs.email }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}

      - name: Close issue with comment
        run: |
          if [ "${{ steps.update.outputs.already }}" = "true" ]; then
            body="邮箱 **${{ steps.update.outputs.email }}** 已经在订阅列表中，无需重复订阅。\n\n本 issue 已自动关闭。"
          else
            body="✅ 已自动将 **${{ steps.update.outputs.email }}** 加入日报订阅列表。\n\n今天的日报已立即发送到你的邮箱，请查收。\n\n从明天早上 8:00（北京时间）开始，你的邮箱将每天自动收到泓济环保行业日报。\n\n如需退订，请回复邮件「退订」或联系管理员。\n\n本 issue 已自动关闭。"
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "$body"
          gh issue close "${{ github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
